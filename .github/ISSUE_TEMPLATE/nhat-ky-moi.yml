name: "📊 Bài Nhật Ký Mới"
description: "Đăng 1 bài phân tích Bitcoin/Vàng (từ TradingView) lên trang Nhật Ký Giao Dịch"
title: "[Nhật Ký] "
labels: ["nhat-ky-moi"]
body:
  - type: markdown
    attributes:
      value: |
        Điền form này sau khi bạn đã đăng bài trên TradingView. TradingView không
        cho nhúng sống 1 bài Ý tưởng cụ thể, nên: chụp nhanh chart bằng icon 📷
        (hoặc Alt+S) trên TradingView, upload lên imgur.com, rồi dán link ảnh + tự
        gõ lại nội dung phân tích vào form dưới đây. Sau khi Submit, 1 con robot sẽ
        tự động chèn bài này vào trang Nhật Ký Giao Dịch trong khoảng 1 phút.

  - type: dropdown
    id: chu-de
    attributes:
      label: Chủ đề
      options:
        - Bitcoin
        - Vàng
    validations:
      required: true

  - type: input
    id: tieu-de
    attributes:
      label: Tiêu đề bài viết
      placeholder: "VD: BTC phá vùng kháng cự 65.000 — chờ retest trước khi vào lệnh"
    validations:
      required: true

  - type: input
    id: ngay-dang
    attributes:
      label: "Ngày đăng (định dạng YYYY-MM-DD)"
      placeholder: "2026-07-15"
    validations:
      required: true

  - type: input
    id: anh-bia
    attributes:
      label: "Link ảnh bìa (upload lên imgur.com rồi dán link vào đây)"
      placeholder: "https://i.imgur.com/xxxxxxx.png"
    validations:
      required: true

  - type: textarea
    id: tom-tat
    attributes:
      label: "Tóm tắt ngắn (1-2 câu, hiện ở box ngoài trang danh sách)"
    validations:
      required: true

  - type: textarea
    id: noi-dung
    attributes:
      label: "Nội dung phân tích đầy đủ (mỗi đoạn cách nhau 1 dòng trống)"
    validations:
      required: true

  - type: input
    id: link-goc
    attributes:
      label: "Link bài gốc trên TradingView (không bắt buộc)"
      placeholder: "https://vn.tradingview.com/chart/XAUUSD/xxxxxxxx/"
    validations:
      required: false
