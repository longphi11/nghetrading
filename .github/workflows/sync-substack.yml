name: Đồng bộ bài viết từ Substack

on:
  schedule:
    # Tự động quét & đồng bộ bài mới từ Substack lúc 8:00 sáng hàng ngày (01:00 UTC)
    - cron: "0 1 * * *"
  workflow_dispatch: {} # cho phép bấm "Run workflow" thủ công trên GitHub

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Chạy script đồng bộ Substack
        run: node scripts/sync-substack.js

      - name: Commit & push nếu có bài mới
        run: |
          if [ "$(cat .sync-result)" = "changed" ]; then
            git config user.name "substack-sync-bot"
            git config user.email "actions@github.com"
            git add posts/ data/posts.json
            git commit -m "🤖 Tự động đồng bộ bài viết mới từ Substack"
            # Luôn pull --rebase trước khi push để tránh conflict
            git pull --rebase origin main
            git push
          else
            echo "Không có bài viết mới, bỏ qua commit."
          fi
